name: Build APK
permissions:
  contents: write
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Use debug signing (APK installs directly on the phone)
        run: mkdir -p ~/.gradle && echo -e "icsopenvpnDebugSign=true\norg.gradle.jvmargs=-Xmx3072M" > ~/.gradle/gradle.properties

      - name: Checkout with OpenVPN sources
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Same signing key every build (so updates install over the old app)
        run: mkdir -p ~/.android && cp ci/debug.keystore ~/.android/debug.keystore

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
          cache: gradle

      - name: Install swig
        run: sudo apt-get update && sudo apt-get install -y swig

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Download Xray-core library (AndroidLibXrayLite)
        env:
          XRAY_LIB_VERSION: v26.11.9
        run: |
          mkdir -p main/libs
          curl -fsSL --retry 3 -o main/libs/libv2ray.aar \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/${XRAY_LIB_VERSION}/libv2ray.aar"
          ls -la main/libs

      - name: Pack current free keys into the APK (fallback when every source is blocked)
        run: |
          mkdir -p main/src/skeleton/assets
          curl -fsSL --retry 3 --max-time 60 -o main/src/skeleton/assets/vless_builtin.txt \
            https://raw.githubusercontent.com/revgiler-arch/FreeVPN/servers/vless.txt \
            || echo "" > main/src/skeleton/assets/vless_builtin.txt
          echo "Built-in keys: $(grep -c '://' main/src/skeleton/assets/vless_builtin.txt || true)"

      - name: Build FreeVPN
        run: ./gradlew :main:assembleSkeletonOvpn2Release

      - name: Collect APK
        run: |
          mkdir -p out
          APK=$(find main/build/outputs/apk -name "*.apk" | grep -i universal | head -n1)
          [ -z "$APK" ] && APK=$(find main/build/outputs/apk -name "*.apk" | head -n1)
          echo "Found: $APK"
          cp "$APK" out/FreeVPN.apk
          # version.json lets the app find out that a newer build exists (self-update)
          CODE=$(grep -m1 -oP 'versionCode = \K[0-9]+' main/build.gradle.kts)
          NAME=$(grep -m1 -oP 'versionName = "\K[^"]+' main/build.gradle.kts)
          NOTES=$(git log -1 --format=%s | sed 's/"/\\"/g')
          printf '{"versionCode": %s, "versionName": "%s", "notes": "%s"}\n' "$CODE" "$NAME" "$NOTES" > out/version.json
          cat out/version.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeVPN-apk
          path: |
            out/FreeVPN.apk
            out/version.json

      - name: Publish to "latest" release (easy download from the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: FreeVPN (последняя сборка)
          prerelease: false
          make_latest: true
          files: |
            out/FreeVPN.apk
            out/version.json
          body: |
            Автосборка из ветки main, коммит ${{ github.sha }}.
            Скачай FreeVPN.apk на телефон и установи (разреши установку из неизвестных источников).
