name: Update server list
# Mirrors the VPN Gate server list to the "servers" branch, so the app can
# download it from GitHub when vpngate.net is blocked or slow on mobile networks.
permissions:
  contents: write
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/servers.yml"]

concurrency:
  group: servers
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Download VPN Gate list
        run: |
          set -e
          mkdir out
          curl -fsSL --retry 3 --max-time 60 -A "FreeVPN-mirror" https://www.vpngate.net/api/iphone/ -o out/servers.csv
          COUNT=$(grep -c -v -E '^(\*|#|$)' out/servers.csv || true)
          echo "Servers: $COUNT"
          if [ "$COUNT" -lt 5 ]; then echo "List looks broken, keeping the old one"; exit 1; fi
          # Free VLESS/Trojan keys picked for Russian mobile networks (github.com/igareck/vpn-configs-for-russia)
          BASE=https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main
          : > out/vless.txt
          for f in Vless-Reality-White-Lists-Rus-Mobile.txt WHITE-CIDR-RU-all.txt BLACK_VLESS_RUS_mobile.txt "BLACK_SS+All_RUS.txt"; do
            curl -fsSL --retry 3 --max-time 60 "$BASE/${f//+/%2B}" >> out/vless.txt || echo "skip $f"
            echo >> out/vless.txt
          done
          echo "Keys: $(grep -c '://' out/vless.txt || true)"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > out/updated.txt

      - name: Publish to "servers" branch
        run: |
          cd out
          git init -q -b servers
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add servers.csv vless.txt updated.txt
          git commit -q -m "Server list $(cat updated.txt)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" servers
