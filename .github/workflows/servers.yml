name: Update server list
# Mirrors the VPN Gate server list to the "servers" branch, so the app can
# download it from GitHub when vpngate.net is blocked or slow on mobile networks.
permissions:
  contents: write
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/servers.yml"]

concurrency:
  group: servers
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Download VPN Gate list
        run: |
          set -e
          mkdir out
          curl -fsSL --retry 3 --max-time 60 -A "FreeVPN-mirror" https://www.vpngate.net/api/iphone/ -o out/servers.csv
          COUNT=$(grep -c -v -E '^(\*|#|$)' out/servers.csv || true)
          echo "Servers: $COUNT"
          if [ "$COUNT" -lt 5 ]; then echo "List looks broken, keeping the old one"; exit 1; fi
          date -u +"%Y-%m-%dT%H:%M:%SZ" > out/updated.txt

      - name: Publish to "servers" branch
        run: |
          cd out
          git init -q -b servers
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add servers.csv updated.txt
          git commit -q -m "Server list $(cat updated.txt)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" servers
